name: terraform-plan-codebuild-runner
run-name: terraform-plan-codebuild-runner

on:
  pull_request:
    branches:
      - main
    paths:
      - 'terraform-resource/**'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  plan:
    runs-on: codebuild-deploy-pipeline-test-${{ github.run_id }}-${{ github.run_attempt }}

    defaults:
      run:
        working-directory: terraform-resource/dev

    env:
      AWS_REGION: ap-northeast-1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.6.6

      - name: terraform fmt
        run: terraform fmt -check -recursive
        id: fmt

      - name: terraform init
        run: terraform init -input=false
        id: init

      - name: terraform validate
        run: terraform validate -no-color
        id: validate

      - name: terraform plan
        run: terraform plan -no-color -input=false
        id: plan
